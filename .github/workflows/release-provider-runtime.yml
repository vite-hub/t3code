name: Release provider runtime

# Publishes @vite-hub/provider-runtime to npm with provenance through npm trusted
# publishing. Sync upstream dispatches it after it advances main.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-provider-runtime
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/contracts --filter @vite-hub/provider-runtime build
      - run: vp test run packages/provider-runtime/src/package-artifact.test.ts

      - name: Choose the next version
        working-directory: packages/provider-runtime
        run: |
          # The checked-in version is the floor. Raise it by hand for a minor or major
          # release; otherwise each release is the next patch after the latest on npm.
          published=$(npm view @vite-hub/provider-runtime version 2>/dev/null || true)
          next=$(node -e '
            const [floor, published] = process.argv.slice(1)
            const parse = (v) => v.split(".").map(Number)
            const newer = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false }
            if (!published) { console.log(floor); process.exit() }
            const [major, minor, patch] = parse(published)
            const bumped = [major, minor, patch + 1]
            console.log((newer(parse(floor), bumped) ? parse(floor) : bumped).join("."))
          ' "$(node -p 'require("./package.json").version')" "$published")
          npm pkg set version="$next"
          echo "Publishing @vite-hub/provider-runtime@$next (latest on npm: ${published:-none})" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        working-directory: packages/provider-runtime
        run: |
          # pnpm pack resolves catalog: and workspace: specifiers; npm publish
          # exchanges the GitHub OIDC token for trusted publishing and provenance.
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).filename')
          npx --yes npm@11 publish "$tarball" --provenance --access public
