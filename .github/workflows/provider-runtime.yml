name: Embedded provider runtime

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: provider-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/contracts --filter @t3tools/provider-runtime build
      - run: vp run --filter @t3tools/provider-runtime typecheck
      - run: vp test run packages/provider-runtime/src apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.lazy.test.ts apps/server/src/provider/ClaudeAdapter.lazy.test.ts apps/server/src/provider/ProviderRegistry.test.ts apps/server/src/provider/codexUsageLimits.test.ts apps/server/src/provider/claudeUsageLimits.test.ts scripts/lib/cli-external-packages.test.ts --maxWorkers=2
