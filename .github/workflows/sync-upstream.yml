name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish preview packages even when upstream is already current
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Clone fork and fetch upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          git clone --single-branch --branch main --no-tags "https://github.com/$GH_REPO.git" .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

      # Installed before the merge so a lockfile-only conflict can be
      # regenerated with the repo's package manager.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Merge upstream main
        id: sync
        run: scripts/sync-upstream.sh merge

      - name: Install dependencies
        id: install
        if: steps.sync.outputs.changed == 'true' || inputs.publish_packages
        run: vp install

      - name: Verify embedded providers before advancing main
        id: verify
        if: steps.sync.outputs.changed == 'true' || inputs.publish_packages
        run: |
          vp run --filter @t3tools/contracts --filter @t3tools/provider-runtime build
          vp run --filter @t3tools/provider-runtime typecheck
          vp test run packages/provider-runtime/src apps/server/src/provider/ProviderRegistry.test.ts apps/server/src/provider/codexUsageLimits.test.ts apps/server/src/provider/claudeUsageLimits.test.ts scripts/lib/cli-external-packages.test.ts --maxWorkers=2

      - name: Advance verified fork
        id: push
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin HEAD:main

      - name: Publish updated packages
        id: publish
        if: steps.sync.outputs.changed == 'true' || inputs.publish_packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pkg-pr-new.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Open or update the sync issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_STEP: >-
            ${{ steps.sync.outcome == 'failure' && 'Merge upstream main'
            || steps.install.outcome == 'failure' && 'Install dependencies'
            || steps.verify.outcome == 'failure' && 'Verify embedded providers'
            || steps.push.outcome == 'failure' && 'Advance verified fork'
            || steps.publish.outcome == 'failure' && 'Publish updated packages'
            || 'Clone fork and fetch upstream or set up vp' }}
        run: |
          if [[ -x scripts/sync-upstream.sh ]]; then
            scripts/sync-upstream.sh report --failed-step "$FAILED_STEP"
          else
            gh label create upstream-sync --color d93f0b --force >/dev/null
            run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            number=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --body "Failed again in $run ($FAILED_STEP)."
            else
              gh issue create --title "Upstream sync needs a manual merge" --label upstream-sync \
                --body "The daily Sync upstream workflow failed at $FAILED_STEP: $run"
            fi
          fi

      - name: Close the sync issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/sync-upstream.sh resolve
