name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish preview packages even when upstream is already current
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          git clone --single-branch --branch main --no-tags "https://github.com/$GH_REPO.git" .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workflow_base=$(git merge-base HEAD upstream/main)
          git diff --name-status "$workflow_base" upstream/main -- .github/workflows \
            > "$RUNNER_TEMP/upstream-workflows.txt"

          # Workflows are fork-owned. GITHUB_TOKEN cannot push upstream workflow
          # changes, and the fork has different release and package operations.
          if ! git merge --no-commit --no-ff upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U -- . \
              ':(exclude).github/workflows/**')
            if [[ -n "$conflicts" ]]; then
              printf 'Unresolved upstream conflicts:\n%s\n' "$conflicts" >&2
              exit 1
            fi
          fi
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git commit --no-edit
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [[ -s "$RUNNER_TEMP/upstream-workflows.txt" ]]; then
            echo "::warning title=Upstream workflows preserved::Review the workflow changes listed in the job summary"
            {
              echo "### Upstream workflow changes need manual review"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/upstream-workflows.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: voidzero-dev/setup-vp@v1
        if: steps.sync.outputs.changed == 'true' || inputs.publish_packages
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify embedded providers before advancing main
        if: steps.sync.outputs.changed == 'true' || inputs.publish_packages
        run: |
          vp run --filter @t3tools/contracts --filter @t3tools/provider-runtime build
          vp run --filter @t3tools/provider-runtime typecheck
          vp test run packages/provider-runtime/src apps/server/src/provider/Layers/ClaudeAdapter.lazy.test.ts apps/server/src/provider/Layers/ClaudeAdapter.test.ts apps/server/src/provider/Layers/CodexAdapter.test.ts apps/server/src/provider/Layers/ProviderRegistry.test.ts apps/server/src/provider/Layers/codexUsageLimits.test.ts apps/server/src/provider/Layers/claudeUsageLimits.test.ts --maxWorkers=2

      - name: Advance verified fork
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Publish updated packages
        if: steps.sync.outputs.changed == 'true' || inputs.publish_packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pkg-pr-new.yml --repo "$GITHUB_REPOSITORY" --ref main
